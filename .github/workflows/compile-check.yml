name: compile-check
# Compiles only. Publishes nothing and does not consume a version number.
on:
  push:
    branches: [main]
    paths: ["android/**"]
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - run: gradle -p android compileDebugKotlin
