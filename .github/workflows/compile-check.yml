name: compile-check
# Full debug build, JVM unit tests (incl. the rule vectors shared with the server) and Android lint. Publishes nothing.
on:
  push:
    branches: [main]
    paths: ["android/**", "config/**", "data/**", ".github/workflows/compile-check.yml"]
  pull_request:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - run: gradle -p android assembleDebug testDebugUnitTest lintDebug --continue
      - name: Summary
        if: always()
        run: |
          {
            echo "### Unit tests"
            for f in android/app/build/test-results/testDebugUnitTest/*.xml; do
              grep -o '<testsuite name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$f" | sed 's/<testsuite //'
            done
            echo "### Lint"
            x=android/app/build/reports/lint-results-debug.xml
            if [ -f "$x" ]; then
              echo "issues: $(grep -c '<issue' "$x")"
              grep -o 'id="[A-Za-z0-9]*"[^>]*severity="[A-Za-z]*"' "$x" | sed -E 's/id="([^"]*)".*severity="([^"]*)"/\2 \1/' | sort | uniq -c | sort -rn
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
