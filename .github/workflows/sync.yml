name: sync-gis
on:
  schedule:
    - cron: "17 3 * * *" # nightly; the city reloads layers around 02:30 local
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/sync.ts", "src/gis.ts", "scripts/holidays.ts"]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      # A layer that fails keeps its previous snapshot; the others are still committed.
      - run: npm run sync || echo "::warning::some layers failed and kept their previous snapshot"
      - run: npx tsx scripts/holidays.ts
      - run: npm run gen-config
      # Never commit a snapshot that breaks the rules or zone tests.
      - run: npm test
      - run: |
          git config user.name "parking-sync"
          git config user.email "parking-sync@users.noreply.github.com"
          git add data config/holidays.json supabase/functions/parking/rules_config.ts
          git diff --cached --quiet || (git commit -m "chore: sync GIS snapshot" && git pull --rebase -q && git push)
