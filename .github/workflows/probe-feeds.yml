name: probe-feeds
on:
  push:
    branches: [main]
    paths: ["scripts/probe-feeds.mjs", ".github/workflows/probe-feeds.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/probe-feeds.mjs
      - run: |
          git config user.name "parking-probe"; git config user.email "parking-probe@users.noreply.github.com"
          git add data/probe && git commit -m "chore: feeds probe" && git pull --rebase -q && git push
