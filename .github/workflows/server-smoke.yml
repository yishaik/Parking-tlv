name: server-smoke
on:
  push:
    branches: [main]
    paths: [".github/workflows/server-smoke.yml"]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      BASE: https://vybivdkskrkafcuedvbg.supabase.co/functions/v1/parking
      KEY: tmp-test-7f3a9c2e
    steps:
      - run: |
          set -x
          curl -s "$BASE/"
          echo
          curl -s -o /dev/null -w "unauth=%{http_code}\n" -X POST "$BASE/mcp" -d '{}'
          rpc() { curl -s -X POST "$BASE/mcp" -H "Authorization: Bearer $KEY" -H 'content-type: application/json' -d "$1" | head -c 4000; echo; echo ----; }
          rpc '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26"}}'
          rpc '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' | head -c 600
          curl -s -X POST "$BASE/api/events" -H "Authorization: Bearer $KEY" -H 'content-type: application/json' \
            -d '{"events":[{"id":"smoke-1","lat":32.0917,"lon":34.7816,"time":1795190000000,"source":"manual","zone":9,"street":"נורדאו","type":"blue_white","search":"5"}]}'
          echo
          rpc '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"where_is_my_car","arguments":{}}}'
          rpc '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"geocode","arguments":{"address":"דיזנגוף 50"}}}'
          rpc '{"jsonrpc":"2.0","id":5,"method":"tools/call","params":{"name":"parking_near_destination","arguments":{"address":"דיזנגוף 50","arrival":"2026-11-22T18:30","minutes":120}}}'
          rpc '{"jsonrpc":"2.0","id":6,"method":"tools/call","params":{"name":"parking_stats","arguments":{}}}'
          curl -s -X DELETE "$BASE/api/events/smoke-1" -H "Authorization: Bearer $KEY"
