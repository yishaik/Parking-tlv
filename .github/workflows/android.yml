name: android
on:
  push:
    branches: [main]
    paths: ["android/**", "data/**", "config/**", ".github/workflows/android.yml"]
  workflow_run:
    workflows: [sync-gis]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - run: gradle -p android assembleDebug --stacktrace
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk parking-tlv.apk
      - uses: actions/upload-artifact@v4
        with: { name: parking-tlv-apk, path: parking-tlv.apk }
      - name: Publish rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest parking-tlv.apk --title "Build #${{ github.run_number }}" --notes "Commit ${{ github.sha }}" --latest
