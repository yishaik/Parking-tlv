name: android
# Manual only: a release is built when the user says it's ready.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - run: gradle -p android assembleDebug --stacktrace
      - name: Name APK with version
        id: v
        run: |
          V="0.1.${{ github.run_number }}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          cp android/app/build/outputs/apk/debug/app-debug.apk "parking-tlv-v$V.apk"
      - uses: actions/upload-artifact@v4
        with: { name: "parking-tlv-v${{ steps.v.outputs.version }}", path: "parking-tlv-v*.apk" }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" "parking-tlv-v${{ steps.v.outputs.version }}.apk" \
            --title "v${{ steps.v.outputs.version }}" --notes "Commit ${{ github.sha }}" --latest
