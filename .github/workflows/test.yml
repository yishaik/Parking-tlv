name: test
# Rules engine, server tools and consistency checks; type-checks the Supabase function.
on:
  push:
    branches: [main]
    paths: ["src/**", "scripts/**", "test/**", "supabase/**", "config/**", "package*.json", "tsconfig.json", ".github/workflows/test.yml"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: deno check --no-config supabase/functions/parking/index.ts
