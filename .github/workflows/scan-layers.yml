name: scan-layers
on:
  push:
    branches: [main]
    paths: ["scripts/scan-layers.mjs", ".github/workflows/scan-layers.yml"]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/scan-layers.mjs
