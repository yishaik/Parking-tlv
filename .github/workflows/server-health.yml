name: server-health
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", ".github/workflows/server-health.yml"]
  workflow_dispatch:
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - run: |
          BASE=https://vybivdkskrkafcuedvbg.supabase.co/functions/v1/parking
          curl -sf "$BASE/" | tee /dev/stderr | grep -q '"mcp"'
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$BASE/mcp" -d '{}')
          echo "unauthenticated /mcp -> $code"; test "$code" = 401
          # v0.6+: Morty link claim rejects a bad code; agent tool route needs a token
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$BASE/link/claim" -d '{"code":"nope"}')
          echo "claim with bad code -> $code"; test "$code" = 400
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$BASE/api/tool/zone_at" -d '{}')
          echo "unauthenticated tool -> $code"; test "$code" = 401
