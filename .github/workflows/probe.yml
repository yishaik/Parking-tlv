name: probe-gis
on:
  workflow_dispatch:
  push:
    paths: ["scripts/probe.ts", "config/places.json", ".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx tsx scripts/probe.ts
      - run: |
          git config user.name "parking-probe"
          git config user.email "parking-probe@users.noreply.github.com"
          git add data/probe
          git diff --cached --quiet || (git commit -m "chore: probe results" && git pull --rebase -q && git push)
